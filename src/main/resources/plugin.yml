name: DialogAuth
version: 1.2.1
main: com.taho.dialogauth.DialogAuth
api-version: '1.21'
author: Taho
description: Native-dialog authentication with Bedrock and verified premium auto-login.
commands:
  dialogauth:
    description: DialogAuth administration and configuration commands.
    usage: /dialogauth <reload|unregister|login>
    permission: dialogauth.admin
permissions:
  dialogauth.admin:
    description: Allows administration of DialogAuth.
    default: op
